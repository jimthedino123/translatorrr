<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Núnúise Dictionary</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f7f8fb;
        color: #333;
        margin: 0;
        padding: 0;
    }
    header {
        background: #5c6bc0;
        color: #fff;
        padding: 1.5rem;
        text-align: center;
    }
    .search-container {
        margin: 2rem auto;
        text-align: center;
    }
    input[type="text"] {
        width: 80%;
        max-width: 500px;
        padding: 0.75rem;
        font-size: 1rem;
        border: 2px solid #5c6bc0;
        border-radius: 6px;
    }
    #result {
        margin-top: 1.5rem;
        text-align: center;
        font-size: 1.25rem;
        min-height: 2rem;
        color: #222;
    }
    .word-list {
        margin: 2rem auto;
        max-width: 800px;
        padding: 0;
        list-style: none;
    }
    .word-list li {
        background: #fff;
        border: 1px solid #ddd;
        margin: 0.5rem 0;
        padding: 0.75rem;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        font-size: 1rem;
    }
    .word-list li span {
        font-weight: bold;
        color: #5c6bc0;
    }
</style>
</head>
<body>

<header>
    <h1>Núnúise Dictionary</h1>
    <p>Search for an English word to find its Núnúise translation</p>
</header>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Type an English word..." autocomplete="off">
    <div id="result"></div>
</div>

<ul class="word-list" id="wordList"></ul>

<script>
(async function() {
    // Fetch the JSON dictionary file
    const response = await fetch('https://nunuise.netlify.app/dictionary.json');
    const dictionary = await response.json();

    const searchInput = document.getElementById('searchInput');
    const resultDiv = document.getElementById('result');
    const wordListEl = document.getElementById('wordList');

    // Show full list initially (optional: long)
    const keys = Object.keys(dictionary).sort();
    keys.forEach(key => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${key}</span> → ${dictionary[key]}`;
        wordListEl.appendChild(li);
    });

    // Filter results on input
    searchInput.addEventListener('input', function() {
        const query = this.value.trim().toLowerCase();
        resultDiv.textContent = '';
        if (!query) return;

        // Find exact or partial matches
        const matches = keys.filter(word => word.toLowerCase().startsWith(query));
        if (matches.length === 0) {
            resultDiv.textContent = 'No match found';
            return;
        }

        // Display best match
        const match = matches[0];
        resultDiv.textContent = `${match} → ${dictionary[match]}`;
    });
})();
</script>

</body>
</html>
