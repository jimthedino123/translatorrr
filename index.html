<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Núnúise Translator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/x-icon" href="IMG_7422.png">

<style>
/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Base */
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, #e3f2fd 0%, transparent 60%),
    radial-gradient(1200px 600px at 90% 110%, #ede7f6 0%, transparent 60%),
    #f7f9fc;
  min-height: 100vh;
  padding: 24px;
  color: #1f2937;
}

/* App shell */
.container {
  max-width: 860px;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-radius: 24px;
  box-shadow:
    0 20px 40px rgba(0, 0, 0, 0.08),
    0 1px 0 rgba(255, 255, 255, 0.6) inset;
  border: 1px solid rgba(255, 255, 255, 0.5);
  overflow: hidden;
}

/* Header */
.header {
  padding: 36px 32px 32px;
  text-align: center;
  background:
    linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(59, 130, 246, 0.9));
  color: #fff;
}

.header h1 {
  font-size: clamp(2rem, 4vw, 2.6rem);
  font-weight: 750;
  letter-spacing: -0.02em;
}

.header p {
  margin-top: 8px;
  font-size: 1rem;
  opacity: 0.9;
}

/* Content */
.content {
  padding: 32px;
}

/* Loading & errors */
.loading-message {
  text-align: center;
  padding: 24px;
  font-size: 0.95rem;
  color: #4f46e5;
}

.error-message {
  background: rgba(239, 68, 68, 0.1);
  color: #b91c1c;
  padding: 16px;
  border-radius: 14px;
  margin: 24px 0;
  text-align: center;
  border: 1px solid rgba(239, 68, 68, 0.25);
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.stat-card {
  background: linear-gradient(135deg, #ffffff, #f8fafc);
  padding: 22px;
  border-radius: 18px;
  text-align: center;
  border: 1px solid rgba(0, 0, 0, 0.05);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
}

.stat-number {
  font-size: 2.1rem;
  font-weight: 700;
  color: #4f46e5;
}

.stat-label {
  margin-top: 6px;
  font-size: 0.85rem;
  color: #6b7280;
}

/* Translator */
.translator-section {
  margin-top: 12px;
}

.input-group {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

/* Inputs */
input[type="text"] {
  flex: 1;
  min-width: 220px;
  padding: 14px 18px;
  font-size: 0.95rem;
  border-radius: 14px;
  border: 1px solid rgba(0, 0, 0, 0.08);
  background: rgba(255, 255, 255, 0.9);
  transition: all 0.25s ease;
}

input[type="text"]::placeholder {
  color: #9ca3af;
}

input[type="text"]:focus {
  outline: none;
  border-color: #6366f1;
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
  background: #fff;
}

/* Buttons */
.btn {
  padding: 14px 22px;
  border-radius: 14px;
  font-size: 0.85rem;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  transition: all 0.25s ease;
}

.btn-primary {
  background: linear-gradient(135deg, #6366f1, #3b82f6);
  color: white;
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 12px 28px rgba(59, 130, 246, 0.35);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  box-shadow: none;
}

/* Result */
.result-container {
  margin-top: 18px;
  background: rgba(248, 250, 252, 0.9);
  border-radius: 18px;
  padding: 22px;
  border: 1px solid rgba(0, 0, 0, 0.05);
  min-height: 120px;
}

#result {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.95rem;
  line-height: 1.65;
  color: #111827;
  white-space: pre-wrap;
}

/* Matches */
.match-title {
  font-weight: 600;
  margin-bottom: 6px;
  color: #4338ca;
}

.match-item {
  background: #fff;
  padding: 10px 14px;
  border-radius: 12px;
  margin: 6px 0;
  border: 1px solid rgba(0, 0, 0, 0.05);
}

/* Animations */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.fade-in {
  animation: fadeIn 0.25s ease-out;
}

@keyframes pulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}

.loading {
  animation: pulse 1.8s ease-in-out infinite;
}

/* Mobile */
@media (max-width: 640px) {
  .content {
    padding: 24px;
  }

  .btn {
    width: 100%;
  }
}
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Núnúise</h1>
      <p>Your Personal Language Translator</p>
    </div>

<div class="content">
  <div id="loadingSection" class="loading-message loading">
    📚 Loading dictionary...
  </div>

  <div id="errorSection" class="error-message" style="display: none;">
    ❌ Could not load dictionary.json file. Please make sure the file exists in the same directory.
  </div>

  <div id="mainContent" style="display: none;">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="wordCount">0</div>
        <div class="stat-label">Words in Dictionary</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="translationCount">0</div>
        <div class="stat-label">Translations Made</div>
      </div>
    </div>

    <div class="translator-section">
      <div class="input-group">
        <input type="text" id="inputWord" placeholder="Enter English or Núnúise word..." autocomplete="off">
        <button class="btn btn-primary" id="translateBtn">
          🔍 Translate
        </button>
      </div>
      
      <div class="result-container">
        <div id="result">Dictionary loaded! Enter a word above to translate.</div>
      </div>
    </div>
  </div>
  <div class="dictionary-cta" onclick="window.location.href='https://nunuise.netlify.app/dict.pdf'">
  <span>📘 Press to visit the full dictionary</span>
</div>

<style>
.dictionary-cta {
  display: inline-block;
  padding: 0.9rem 1.4rem;
  background: #556cd6;
  color: white;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.dictionary-cta:hover {
  background: #465ad4;
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.2);
}

.dictionary-cta:active {
  transform: translateY(0);
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}
</style>
</div>

  </div>

<script>
(function(){
  // core data
  let dictionary = {};
  let reverseDictionary = {}; // secretLower -> englishOriginal
  let engNormalizedMap = new Map();    // normalizedEnglish -> englishOriginal
  let secretNormalizedToEnglish = new Map(); // normalizedSecret -> englishOriginal
  let maxWords = 1;

  // state
  let translationCount = 0;
  let dictionaryLoaded = false;

  // helpers
  function normalizeKey(s) {
    return (s || "").toLowerCase().replace(/\s+/g, " ").trim();
  }

  function loadTranslationCount() {
    const saved = localStorage.getItem('secretLang_translationCount');
    if (saved) {
      try {
        translationCount = parseInt(saved, 10) || 0;
      } catch (err) {
        console.error("Error loading translation count:", err);
      }
    }
  }

  function saveTranslationCount() {
    localStorage.setItem('secretLang_translationCount', translationCount.toString());
  }

  // load dictionary.json
  async function loadDictionary() {
    try {
      const response = await fetch('dictionary.json');
      if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      const data = await response.json();
      if (typeof data !== 'object' || data === null) throw new Error('Dictionary file invalid');
      dictionary = data;
      buildMapsFromDictionary();
      dictionaryLoaded = true;
      showMainContent();
      updateStats();
    } catch (err) {
      console.error("Failed to load dictionary:", err);
      showError();
    }
  }

  // build reverse map and normalized lookup maps
  function buildMapsFromDictionary() {
    reverseDictionary = {};
    engNormalizedMap = new Map();
    secretNormalizedToEnglish = new Map();
    maxWords = 1;

    for (const [english, secret] of Object.entries(dictionary)) {
      if (typeof secret !== 'string') continue;
      const engNorm = normalizeKey(english);
      const secNorm = normalizeKey(secret);
      engNormalizedMap.set(engNorm, english);
      // map normalized secret -> english (for secret->english translations)
      secretNormalizedToEnglish.set(secNorm, english);
      // mapping used for quick reverse lookup (secretLower -> englishOriginal)
      reverseDictionary[secret.toLowerCase()] = english;
      // track longest phrase length needed
      const engWords = engNorm ? engNorm.split(' ').length : 0;
      const secWords = secNorm ? secNorm.split(' ').length : 0;
      maxWords = Math.max(maxWords, engWords, secWords, 1);
    }
  }

  function showMainContent() {
    document.getElementById('loadingSection').style.display = 'none';
    document.getElementById('errorSection').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    document.getElementById('mainContent').classList.add('fade-in');
    setTimeout(() => document.getElementById('inputWord').focus(), 100);
  }

  function showError() {
    document.getElementById('loadingSection').style.display = 'none';
    document.getElementById('errorSection').style.display = 'block';
    document.getElementById('mainContent').style.display = 'none';
  }

  function updateStats() {
    document.getElementById('wordCount').textContent = Object.keys(dictionary).length;
    document.getElementById('translationCount').textContent = translationCount;
  }

  // Unicode-aware strip of leading/trailing non-letter/number
  function stripEdgeNonAlnum(s) {
    // uses Unicode property escapes (modern browsers)
    return s.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
  }

  function isWhitespaceToken(tok) {
    return /^\s+$/.test(tok);
  }

  function startsWithCapitalLetter(tok) {
    const m = tok.match(/\p{L}/u);
    return m ? (m[0] === m[0].toUpperCase()) : false;
  }

  function applyCapitalization(originalToken, replacement) {
    if (!replacement) return replacement;
    if (startsWithCapitalLetter(originalToken)) {
      return replacement.charAt(0).toUpperCase() + replacement.slice(1);
    }
    return replacement;
  }

  // Robust sentence/phrase translator (handles multi-word entries and both directions)
  function translateSentence(sentence) {
    if (!dictionaryLoaded) return sentence;

    // keep original spacing/punctuation by splitting but keeping whitespace tokens
    const tokens = sentence.split(/(\s+)/);
    const out = [];

    for (let i = 0; i < tokens.length; i++) {
      const tok = tokens[i];
      if (isWhitespaceToken(tok)) { out.push(tok); continue; }

      // count how many real (non-whitespace) tokens remain
      let remaining = 0;
      for (let k = i; k < tokens.length; k++) if (!isWhitespaceToken(tokens[k])) remaining++;

      let matched = false;
      const tryMax = Math.min(maxWords, remaining);

      // try the longest phrase first (greedy)
      for (let wc = tryMax; wc >= 1 && !matched; wc--) {

        // collect indices of the next wc non-whitespace tokens
        const idxs = [];
        let p = i;
        while (p < tokens.length && idxs.length < wc) {
          if (!isWhitespaceToken(tokens[p])) idxs.push(p);
          p++;
        }
        if (idxs.length < wc) continue;

        // build cleaned parts for candidate
        const cleanedParts = idxs.map(idx => stripEdgeNonAlnum(tokens[idx]).toLowerCase());
        const candidate = cleanedParts.join(' ').trim();
        if (!candidate) continue;

        // check english -> secret
        if (engNormalizedMap.has(candidate)) {
          const englishKey = engNormalizedMap.get(candidate);
          let replacement = dictionary[englishKey];
          // preserve leading/trailing punctuation from first/last tokens
          const first = tokens[idxs[0]];
          const last = tokens[idxs[idxs.length - 1]];
          const leading = (first.match(/^[^\p{L}\p{N}]*/u) || [""])[0];
          const trailing = (last.match(/[^\p{L}\p{N}]*$/u) || [""])[0];
          replacement = applyCapitalization(first, replacement);
          out.push(leading + replacement + trailing);
          i = idxs[idxs.length - 1]; // advance past matched tokens
          matched = true;
          break;
        }

        // check secret -> english
        if (secretNormalizedToEnglish.has(candidate)) {
          const english = secretNormalizedToEnglish.get(candidate);
          let replacement = english;
          const first = tokens[idxs[0]];
          const last = tokens[idxs[idxs.length - 1]];
          const leading = (first.match(/^[^\p{L}\p{N}]*/u) || [""])[0];
          const trailing = (last.match(/[^\p{L}\p{N}]*$/u) || [""])[0];
          replacement = applyCapitalization(first, replacement);
          out.push(leading + replacement + trailing);
          i = idxs[idxs.length - 1];
          matched = true;
          break;
        }
      }

      if (!matched) {
        // no multi-word match; keep original token
        out.push(tok);
      }
    }

    return out.join('');
  }

  // single-word/sentence entry handler
  function translateWord(word) {
    if (!dictionaryLoaded) return "Dictionary not loaded yet. Please wait...";
    const input = (word || "").trim();
    if (!input) return "Please enter a word or sentence to translate.";

    if (input.includes(" ")) {
      translationCount++;
      saveTranslationCount();
      updateStats();
      return "✅ Sentence translation:\n" + translateSentence(input);
    }

    const lowerInput = input.toLowerCase();

    // try exact english -> secret
    // Normalize keys for lookup
    const engKey = Object.keys(dictionary).find(k => normalizeKey(k) === normalizeKey(input));
    if (engKey) {
      translationCount++;
      saveTranslationCount();
      updateStats();
      return formatResult(input, dictionary[engKey], "English → Secret");
    }

    // try exact secret -> english
    if (reverseDictionary[lowerInput]) {
      translationCount++;
      saveTranslationCount();
      updateStats();
      return formatResult(input, reverseDictionary[lowerInput], "Secret → English");
    }

    // fuzzy matches (contains)
    const englishMatches = Object.keys(dictionary).filter(key => key.toLowerCase().includes(lowerInput)).slice(0, 10);
    const secretMatches = Object.keys(reverseDictionary).filter(key => key.includes(lowerInput)).slice(0, 10);

    let result = "";
    if (englishMatches.length > 0) {
      result += formatMatches("English matches:", englishMatches.map(key => ({
        from: key, to: dictionary[key], type: "English → Secret"
      })));
    }
    if (secretMatches.length > 0) {
      if (result) result += "\n\n";
      result += formatMatches("Secret matches:", secretMatches.map(key => ({
        from: key, to: reverseDictionary[key], type: "Secret → English"
      })));
    }
    if (!result) {
      result = `No matches found for "${input}".\nTry checking spelling or entering a sentence.`;
    }
    return result;
  }

  function formatResult(from, to, type) {
    return `✅ ${from} → ${to}\n(${type})`;
  }

  function formatMatches(title, matches) {
    let result = `${title}\n`;
    matches.forEach(match => { result += `  • ${match.from} → ${match.to}\n`; });
    return result;
  }

  // UI wiring
  document.addEventListener('DOMContentLoaded', function() {
    loadTranslationCount();
    loadDictionary();
    const inputWord = document.getElementById('inputWord');
    const resultDiv = document.getElementById('result');
    document.getElementById('translateBtn').addEventListener('click', function() {
      if (!dictionaryLoaded) return;
      const result = translateWord(inputWord.value);
      resultDiv.textContent = result;
      resultDiv.classList.add('fade-in');
      setTimeout(() => resultDiv.classList.remove('fade-in'), 300);
    });
    inputWord.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && dictionaryLoaded) {
        document.getElementById('translateBtn').click();
      }
    });
  });
})();
</script>

</body>
</html></html>
